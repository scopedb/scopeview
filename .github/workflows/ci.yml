name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    name: Build and test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: scopeview-check-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Validate release metadata
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'));
          assert.match(pkg.version, /^\d+\.\d+\.\d+$/, 'Release a stable version');
          assert.equal(process.env.GITHUB_REF_NAME, `v${pkg.version}`, 'Tag and package version must match');
          const changelog = readFileSync('CHANGELOG.md', 'utf8');
          const header = changelog.split('\n').find(line => line.startsWith(`## v${pkg.version} (`));
          assert.match(header ?? '', /^## v\d+\.\d+\.\d+ \(\d{4}-\d{2}-\d{2}\)$/, 'Finalize the changelog date before tagging');
          JS
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          cache: true
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm verify
      - run: pnpm docs:build
      - name: Retain the tested npm package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: npm-package
          path: .local/releases/npm/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - name: Retain failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: test-failures
          path: |
            playwright-report/
            test-results/
            .local/package-tests/
          include-hidden-files: true
          retention-days: 7
