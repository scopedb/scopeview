name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/release.yml
      - .node-version
      - scripts/distribution.mjs
      - scripts/distribution/**
      - tests/distribution.mjs

permissions:
  contents: read

concurrency:
  group: scopeview-release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  native:
    name: CLI / ${{ matrix.target }}
    needs: verify
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: linux-x64
          - runner: ubuntu-24.04-arm
            target: linux-arm64
          - runner: macos-15
            target: darwin-arm64
          - runner: macos-15-intel
            target: darwin-x64
          - runner: windows-2025
            target: windows-x64
          - runner: windows-11-arm
            target: windows-arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          architecture: ${{ endsWith(matrix.target, 'arm64') && 'arm64' || 'x64' }}
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: npm-package
          path: .local/npm
      - name: Build and test the native archive
        shell: bash
        run: |
          package=(.local/npm/*.tgz)
          node scripts/distribution.mjs --package "${package[0]}" --output .local/native
          node tests/distribution.mjs --directory .local/native
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: cli-${{ matrix.target }}
          path: |
            .local/native/*.tar.gz
            .local/native/*.zip
            .local/native/*.sha256
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - name: Retain native failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: native-failure-${{ matrix.target }}
          path: .local/distribution-tests/
          include-hidden-files: true
          retention-days: 7

  publish:
    name: Publish npm and GitHub Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: [verify, native]
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: npm-package
          path: .local/release
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: cli-*
          merge-multiple: true
          path: .local/release
      - name: Verify accepted artifacts
        working-directory: .local/release
        run: |
          for checksum in *.sha256; do sha256sum --check "$checksum"; done
      - name: Check npm version and existing publication
        id: npm
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { execFileSync } from 'node:child_process';
          import { createHash } from 'node:crypto';
          import { appendFileSync, readFileSync } from 'node:fs';
          const [major, minor, patch] = execFileSync('npm', ['--version'], { encoding: 'utf8' }).trim().split('.').map(Number);
          assert.ok(major > 11 || (major === 11 && (minor > 5 || (minor === 5 && patch >= 1))), 'Trusted publishing needs npm >= 11.5.1');
          const { name, version } = JSON.parse(readFileSync('package.json', 'utf8'));
          const tarball = `.local/release/scopedb-scopeview-${version}.tgz`;
          const integrity = `sha512-${createHash('sha512').update(readFileSync(tarball)).digest('base64')}`;
          const response = await fetch(`https://registry.npmjs.org/${encodeURIComponent(name)}/${version}`);
          if (response.ok) {
            assert.equal((await response.json()).dist.integrity, integrity, 'An existing npm version has different bytes; never replace it');
          } else {
            assert.equal(response.status, 404, 'Registry lookup failed; do not assume the version is unused');
          }
          appendFileSync(process.env.GITHUB_OUTPUT, `exists=${response.ok}\ntarball=${tarball}\n`);
          const changelog = readFileSync('CHANGELOG.md', 'utf8');
          const section = changelog.split(`## v${version} (`)[1].split('\n').slice(1).join('\n').split('\n## ')[0].trim();
          assert.ok(section, 'Release notes must not be empty');
          appendFileSync('/tmp/scopeview-release-notes.md', `${section}\n`);
          JS
      - name: Publish the tested tarball using npm trusted publishing
        if: steps.npm.outputs.exists != 'true'
        env:
          TARBALL: ${{ steps.npm.outputs.tarball }}
        run: npm publish "$TARBALL" --access public --ignore-scripts
      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" .local/release/* --verify-tag --title "ScopeView $GITHUB_REF_NAME" --notes-file /tmp/scopeview-release-notes.md
