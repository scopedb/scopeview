<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>ScopeView headless views</title>
    <style>
      body { margin: 24px; font: 13px/1.4 system-ui; background: #f4f5f7; color: #202b38; }
      main { max-width: 1080px; margin: auto; display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 16px; }
      h1 { max-width: 1080px; margin: 0 auto 24px; font-size: 18px; }
      section { min-width: 0; }
      h2 { font-size: 12px; font-weight: 400; }
      details { margin-top: 8px; }
      pre { max-height: 240px; overflow: auto; white-space: pre-wrap; overflow-wrap: anywhere; }
      .chart { --scope-chart-height: 240px; }
      @media (max-width: 700px) { body { margin: 8px; } main { grid-template-columns: minmax(0,1fr); } }
    </style>
  </head>
  <body>
    <h1>Headless views</h1>
    <main></main>
    <script type="module">
      import { createVisualization } from '../src/headless.ts';
      import { demoDocument } from '../docs/.vitepress/theme/demo-data.ts';
      for (const family of ['bar', 'trace', 'profile']) {
        for (const theme of ['light', 'dark']) {
          const section = document.createElement('section');
          const heading = document.createElement('h2');
          heading.textContent = `${family} · ${theme}`;
          const host = document.createElement('div');
          host.className = 'chart';
          host.id = `${family}-${theme}`;
          const details = document.createElement('details');
          const summary = document.createElement('summary');
          summary.textContent = 'Inspection context';
          const output = document.createElement('pre');
          output.textContent = 'Hover or use the arrow keys to inspect a source.';
          details.append(summary, output);
          section.append(heading, host, details);
          document.querySelector('main').append(section);
          createVisualization(host, demoDocument(family), {
            theme,
            onInspect: (_target, context) => {
              output.textContent = context ? JSON.stringify(context, null, 2) : 'No inspected source.';
            }
          });
        }
      }
    </script>
  </body>
</html>
